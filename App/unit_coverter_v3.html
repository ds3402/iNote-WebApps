<!doctype html>

<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>모바일 단위 변환기 v3</title>
  <style>
    :root{--bg:#f7f7f8;--card:#ffffff;--text:#111;--muted:#6b7280;--accent:#2563eb;--border:#e5e7eb;--shadow:0 6px 24px rgba(0,0,0,.06)}
    @media (prefers-color-scheme: dark){:root{--bg:#0b0b0c;--card:#111214;--text:#f8fafc;--muted:#a3a3a3;--accent:#60a5fa;--border:#1f2937;--shadow:0 6px 24px rgba(0,0,0,.35)}}
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;background:var(--bg);color:var(--text);font:16px/1.45 system-ui,-apple-system,Segoe UI,Roboto,Apple SD Gothic Neo,Pretendard,Malgun Gothic,sans-serif}
    .wrap{max-width:760px;margin:0 auto;padding:0 env(safe-area-inset-right) 80px env(safe-area-inset-left)}
    header{position:sticky;top:0;z-index:10;background:color-mix(in oklab, var(--card) 80%, transparent);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--border)}
    .hbox{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;gap:10px}
    .title{font-weight:700}
    .note{font-size:12px;color:var(--muted)}
    main{padding:16px}
    .card{background:var(--card);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow);padding:14px}
    .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .row-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
    .row-1{display:grid;grid-template-columns:1fr;gap:10px}
    label{font-size:12px;color:var(--muted)}
    input,select,button{width:100%;border:1px solid var(--border);border-radius:12px;padding:12px 12px;background:transparent;color:var(--text)}
    input::placeholder{color:#9aa1aa}
    .btn{background:var(--accent);border-color:transparent;color:#fff;box-shadow:0 2px 10px color-mix(in oklab, var(--accent) 40%, transparent)}
    .seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--border);border-radius:12px;overflow:hidden}
    .seg button{border:0;background:transparent;padding:8px 12px;color:var(--muted);white-space:nowrap;transition:background-color .2s ease, color .2s ease, box-shadow .2s ease;font-weight:600}
    .seg button.active{background:color-mix(in oklab, var(--accent) 18%, var(--card));color:var(--text);box-shadow:inset 0 0 0 1px color-mix(in oklab, var(--accent) 35%, transparent), 0 0 0 1px color-mix(in oklab, var(--accent) 22%, transparent)}
    .list{margin-top:10px;display:grid;gap:8px}
    .item{display:flex;align-items:center;justify-content:space-between;border:1px solid var(--border);background:color-mix(in oklab, var(--card) 92%, transparent);padding:10px 12px;border-radius:12px}
    .muted{color:var(--muted)}
    .result{font-size:22px;font-weight:800;letter-spacing:-.2px}
    footer{position:fixed;left:0;right:0;bottom:0;border-top:1px solid var(--border);background:color-mix(in oklab, var(--card) 80%, transparent);backdrop-filter:blur(8px)}
    .fbox{max-width:760px;margin:0 auto;padding:10px 24px 16px;color:var(--muted);font-size:12px}
    .inline{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  </style>

    <meta name="inote:title" content="단위 변환기">
    <meta name="inote:description" content="길이, 무게, 각도 등 다양한 단위를 간편하게 변환합니다.">
    <meta name="inote:category" content="Utility">
    <meta name="inote:icon" content="🧮">
    <meta name="inote:keywords" content="단위, 변환, 길이, 무게, 각도">
    <meta name="inote:publish" content="true">
    <meta name="inote:version" content="1.0">
    <meta name="inote:updated" content="">
    <meta name="inote:badge" content="">
    <meta name="inote:badge-until" content="">
</head>
<body>
  <header>
    <div class="wrap hbox">
      <div class="inline">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="2" width="14" height="20" rx="2"/><line x1="12" y1="18" x2="12.01" y2="18"/></svg>
        <div>
          <div class="title">모바일 단위 변환기 v3</div>
          <div class="note">제작: 주식회사 유현</div>
        </div>
      </div>
      <div class="inline">
        <button id="btnClear" title="초기화" style="width:auto;padding:8px 10px;border-radius:10px">초기화</button>
      </div>
    </div>
  </header>  <main class="wrap">
    <div class="card" role="group" aria-label="단위 변환">
      <div class="row-3" style="margin-bottom:8px">
        <div>
          <label>카테고리</label>
          <select id="category"></select>
        </div>
        <div>
          <label>입력값</label>
          <input id="inputValue" inputmode="decimal" placeholder="숫자 입력" />
        </div>
        <div>
          <label>보기 방식</label>
          <div class="seg" role="tablist" aria-label="보기 방식">
            <button id="modeAll" class="active" role="tab" aria-selected="true">전체</button>
            <button id="modeOne" role="tab" aria-selected="false">단일</button>
          </div>
        </div>
      </div><div class="row" style="margin-bottom:8px">
    <div>
      <label>기준 단위 (From)</label>
      <select id="fromUnit"></select>
    </div>
    <div id="toWrap" style="display:none">
      <label>대상 단위 (To)</label>
      <select id="toUnit"></select>
    </div>
  </div>

  <div id="resultArea" class="row-1">
    <div class="muted">값을 입력하면 결과가 표시됩니다.</div>
  </div>
</div>

<p class="note" style="margin-top:10px">참고용입니다. 공학 계산 시 유효숫자와 단위계를 확인하세요.</p>

  </main>  <footer>
    <div class="fbox">홈 화면에 추가하면 앱처럼 사용할 수 있어요. (브라우저 공유/메뉴 → 홈 화면에 추가)</div>
  </footer>  <script>
    // ===== 단위 데이터 =====
    const torque = {"N·m":1,"kgf·m":9.80665,"kgf·cm":0.0980665,"lbf·ft":1.3558179483314004,"lbf·in":0.1129848290276167};
    const pressure = {"Pa":1,"kPa":1e3,"MPa":1e6,"GPa":1e9,"bar":1e5,"mbar":100,"atm":101325,"psi":6894.757293168,"kgf/cm²":98066.5,"kgf/m²":9.80665,"mmHg":133.322387415,"inHg":3386.389};
    const length = {"pm":1e-12,"nm":1e-9,"μm":1e-6,"mm":1e-3,"cm":1e-2,"m":1,"km":1e3,"in":0.0254,"ft":0.3048,"yd":0.9144,"mile":1609.344,"해리":1852,"자":0.303030303030303,"광년":9.4607304725808e15};
    const mass = {"μg":1e-9,"mg":1e-6,"g":1e-3,"kg":1,"ton":1000,"근(600g)":0.6,"돈":0.00375,"oz":0.028349523125,"lb":0.45359237,"stone":6.35029318};
    const area = {"mm²":1e-6,"cm²":1e-4,"m²":1,"km²":1e6,"평":3.305785,"단보":991.7355,"정보":9917.355,"a":100,"ha":10000,"acre":4046.8564224,"ft²":0.09290304,"in²":0.00064516,"yd²":0.83612736};
    const volume = {"mm³":1e-9,"cm³":1e-6,"m³":1,"mL":1e-6,"L":1e-3,"cc":1e-6,"fl oz":2.95735295625e-5,"cup":2.365882365e-4,"pint":4.73176473e-4,"quart":9.46352946e-4,"gallon":0.003785411784,"ft³":0.028316846592,"in³":0.000016387064,"yd³":0.764554857984,"홉":0.00018039,"되":0.0018039,"말":0.018039};
    const speed = {"mm/s":1e-3,"cm/s":1e-2,"m/s":1,"km/h":0.2777777777777778,"ft/s":0.3048,"mph":0.44704,"kn":0.5144444444444445};
    const force = {"N":1,"kN":1000,"MN":1e6,"kgf":9.80665,"tf":9806.65,"lbf":4.4482216152605};
    const energy = {"J":1,"kJ":1e3,"MJ":1e6,"Wh":3600,"kWh":3.6e6,"cal":4.184,"kcal":4184,"BTU":1055.05585262,"eV":1.602176634e-19,"keV":1.602176634e-16,"MeV":1.602176634e-13};
    const power = {"W":1,"kW":1e3,"MW":1e6,"GW":1e9,"PS":735.49875,"hp":745.6998715822702};
    const voltage = {"μV":1e-6,"mV":1e-3,"V":1,"kV":1e3,"MV":1e6};
    const current = {"μA":1e-6,"mA":1e-3,"A":1,"kA":1e3};
    const resistance = {"mΩ":1e-3,"Ω":1,"kΩ":1e3,"MΩ":1e6};
    const frequency = {"Hz":1,"kHz":1e3,"MHz":1e6,"GHz":1e9};
    const angle = {"°":1,"rad":180/Math.PI,"grad":0.9};
    const flow = {"mL/min":1e-6/60,"L/min":1e-3/60,"L/s":1e-3,"m³/h":1/3600,"gal/min":0.003785411784/60};
    const viscosity = {"Pa·s":1,"mPa·s":1e-3,"cP":1e-3,"cSt":1e-6};
    const density = {"kg/m³":1,"g/cm³":1000,"g/mL":1000,"kg/L":1000};
    const timeUnits = {"ms":0.001,"s":1,"min":60,"h":3600,"day":86400,"week":604800,"month(30일)":2592000,"year(365일)":31536000};
    const temperatureUnits = ["°C","°F","K"];

    // 데이터 용량: bit 기준. SI(KB=1000B)와 IEC(KiB=1024B) 구분
    const dataUnits = {
      "bit":{factor:1},"B":{factor:8},"KB":{factor:8e3},"MB":{factor:8e6},
      "GB":{factor:8e9},"TB":{factor:8e12},"PB":{factor:8e15},
      "KiB":{factor:8*1024},"MiB":{factor:8*1024**2},"GiB":{factor:8*1024**3},"TiB":{factor:8*1024**4}
    };

    const CATS = [
      {key:"torque",label:"토크",units:torque,default:"N·m"},
      {key:"pressure",label:"압력",units:pressure,default:"MPa"},
      {key:"length",label:"길이",units:length,default:"m"},
      {key:"mass",label:"무게",units:mass,default:"kg"},
      {key:"area",label:"면적",units:area,default:"m²"},
      {key:"volume",label:"체적",units:volume,default:"L"},
      {key:"speed",label:"속도",units:speed,default:"km/h"},
      {key:"force",label:"힘",units:force,default:"N"},
      {key:"energy",label:"에너지",units:energy,default:"J"},
      {key:"power",label:"전력",units:power,default:"kW"},
      {key:"voltage",label:"전압",units:voltage,default:"V"},
      {key:"current",label:"전류",units:current,default:"A"},
      {key:"resistance",label:"전기저항",units:resistance,default:"Ω"},
      {key:"frequency",label:"주파수",units:frequency,default:"Hz"},
      {key:"angle",label:"각도",units:angle,default:"°"},
      {key:"flow",label:"유량",units:flow,default:"L/min"},
      {key:"viscosity",label:"점도",units:viscosity,default:"mPa·s"},
      {key:"density",label:"밀도",units:density,default:"kg/m³"},
      {key:"time",label:"시간",units:timeUnits,default:"s"},
      {key:"data",label:"데이터",units:dataUnits,default:"MB"},
      {key:"temperature",label:"온도",units:null,default:"°C"}
    ];

    const $=id=>document.getElementById(id);
    const categorySel=$("category"), inputValue=$("inputValue"), fromSel=$("fromUnit"), toSel=$("toUnit");
    const toWrap=$("toWrap"), resultArea=$("resultArea"), modeAll=$("modeAll"), modeOne=$("modeOne"), btnClear=$("btnClear");
    let mode="all";

    function fmt(n){
      if(!Number.isFinite(n)) return "-";
      const abs=Math.abs(n);
      if(abs!==0&&(abs>=1e9||abs<1e-7)) return n.toExponential(6).replace(/\.?0+e/,"e");
      const digits=abs>=1000?2:abs>=1?4:6;
      return Number(n.toFixed(digits)).toString();
    }
    function convertLinear(v,from,to,map){return v*map[from]/map[to];}
    function convertData(v,from,to){return v*dataUnits[from].factor/dataUnits[to].factor;}
    function convertTemperature(v,from,to){
      let c=from==="°C"?v:from==="°F"?(v-32)*5/9:v-273.15;
      return to==="°C"?c:to==="°F"?c*9/5+32:c+273.15;
    }
    function getUnits(cat){return cat.key==="temperature"?temperatureUnits:Object.keys(cat.units);}
    function convertValue(v,from,to,cat){
      if(cat.key==="temperature") return convertTemperature(v,from,to);
      if(cat.key==="data") return convertData(v,from,to);
      return convertLinear(v,from,to,cat.units);
    }
    function fillCategories(){
      categorySel.innerHTML=CATS.map(c=>`<option value="${c.key}">${c.label}</option>`).join("");
      categorySel.value="torque";
    }
    function fillUnits(){
      const cat=CATS.find(c=>c.key===categorySel.value), units=getUnits(cat);
      fromSel.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join("");
      toSel.innerHTML=units.map(u=>`<option value="${u}">${u}</option>`).join("");
      fromSel.value=cat.default&&units.includes(cat.default)?cat.default:units[0];
      toSel.value=units.find(u=>u!==fromSel.value)||units[0];
      toWrap.style.display=mode==="one"?"block":"none";
      render();
    }
    function render(){
      const cat=CATS.find(c=>c.key===categorySel.value), raw=(inputValue.value||"").replace(/,/g,"").trim(), v=Number(raw);
      resultArea.innerHTML="";
      if(raw===""||!Number.isFinite(v)){resultArea.innerHTML=`<div class="muted">값을 입력하면 결과가 표시됩니다.</div>`;return;}
      const units=getUnits(cat);
      if(mode==="one"){
        resultArea.innerHTML=cardResult(convertValue(v,fromSel.value,toSel.value,cat),toSel.value);
      }else{
        resultArea.appendChild(listEl(units.filter(u=>u!==fromSel.value).map(u=>({unit:u,value:convertValue(v,fromSel.value,u,cat)}))));
      }
    }
    function listEl(items){
      const wrap=document.createElement("div"); wrap.className="list";
      items.forEach(({unit,value})=>{
        const row=document.createElement("div"); row.className="item";
        row.innerHTML=`<div><strong>${fmt(value)}</strong> ${unit}</div><button title="복사" style="width:auto;padding:8px 10px;border-radius:10px">복사</button>`;
        row.querySelector("button").addEventListener("click",()=>{navigator.clipboard?.writeText(`${fmt(value)} ${unit}`);toast("복사했어요");});
        wrap.appendChild(row);
      });
      return wrap;
    }
    function cardResult(value,unit){
      return `<div class="card" style="margin-top:6px"><div class="muted">결과</div><div class="result">${fmt(value)} ${unit}</div><div class="inline" style="margin-top:8px"><button class="btn" id="copyOne">복사</button></div></div>`;
    }
    function toast(msg){
      const t=document.createElement("div");t.textContent=msg;
      t.style.cssText="position:fixed;left:50%;bottom:84px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 14px;border-radius:12px;opacity:.96;z-index:9999;box-shadow:0 8px 30px rgba(0,0,0,.3);font-size:13px";
      if(matchMedia("(prefers-color-scheme: dark)").matches){t.style.background="#fff";t.style.color="#111";}
      document.body.appendChild(t);setTimeout(()=>t.remove(),1100);
    }

    categorySel.addEventListener("change",fillUnits);
    inputValue.addEventListener("input",render);
    fromSel.addEventListener("change",render);
    toSel.addEventListener("change",render);
    btnClear.addEventListener("click",()=>{inputValue.value="";render();inputValue.focus();});
    modeAll.addEventListener("click",()=>{mode="all";modeAll.classList.add("active");modeOne.classList.remove("active");modeAll.setAttribute("aria-selected","true");modeOne.setAttribute("aria-selected","false");toWrap.style.display="none";render();});
    modeOne.addEventListener("click",()=>{mode="one";modeOne.classList.add("active");modeAll.classList.remove("active");modeOne.setAttribute("aria-selected","true");modeAll.setAttribute("aria-selected","false");toWrap.style.display="block";render();});
    document.addEventListener("click",e=>{const btn=e.target.closest("#copyOne");if(!btn)return;const txt=document.querySelector(".result")?.textContent?.trim();if(txt){navigator.clipboard?.writeText(txt);toast("복사했어요");}});
    window.addEventListener("DOMContentLoaded",()=>{fillCategories();fillUnits();});
  </script></body>
</html>
