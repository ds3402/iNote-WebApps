<html lang="ko">

    <style>
:root{
  --bg:#ffffff;
  --fg:#0f172a;
  --muted:#64748b;
  --border:#e2e8f0;
  --card:#ffffff;
  --subtle:#f8fafc;
  --accent:#0ea5e9;
  --accent-ink:#075985;
  --blue:#2563eb;
  --green:#16a34a;
  --orange:#f97316;
  --red:#dc2626;
  --shadow:0 1px 1.5px rgba(2,6,23,.05),0 4px 12px rgba(2,6,23,.03);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  font-family:ui-sans-serif,-apple-system,system-ui,"Segoe UI",Roboto,"Helvetica Neue",Arial,
    "Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif;
  color:var(--fg);
  background:var(--bg);
  padding:0;
}
button,input,select{font:inherit}

.container{
  max-width:680px;
  margin:0 auto;
  padding:12px 12px 32px;
}

/* Header — recent apps style */
.header{
  position:sticky;
  top:0;
  z-index:10;
  margin:-12px -12px 12px;
  padding:11px 16px 10px;
  background:linear-gradient(180deg,#ffffffee,#ffffffcc);
  backdrop-filter:saturate(180%) blur(8px);
  border-bottom:1px solid var(--border);
  text-align:left;
}
.title{
  font-size:18px;
  line-height:1.25;
  font-weight:700;
  letter-spacing:.15px;
  color:var(--fg);
}
.subtitle{
  margin-top:2px;
  font-size:10px;
  color:var(--muted);
}

/* Cards */
.card{
  background:var(--card);
  border:1px solid var(--border);
  border-radius:16px;
  box-shadow:var(--shadow);
  padding:12px;
  margin-bottom:12px;
}
.card-title{
  font-size:14px;
  line-height:1.3;
  font-weight:700;
  color:#334155;
  margin-bottom:9px;
}

/* Model */
.model-select{
  width:100%;
  padding:10px 12px;
  background:var(--subtle);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:13px;
  appearance:auto;
}
.model-select:focus{
  outline:2px solid #93c5fd;
  outline-offset:0;
}
.range-info{
  text-align:center;
  margin-top:7px;
  font-size:11px;
  color:var(--blue);
}

/* Inputs */
.input-section{margin-bottom:0}
.input-title{
  font-size:12px;
  font-weight:600;
  color:var(--muted);
  margin-bottom:7px;
}
.input-container{
  display:flex;
  align-items:center;
  gap:8px;
  margin-bottom:12px;
}
.torque-input{
  flex:1;
  min-width:0;
  padding:11px 12px;
  background:var(--subtle);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:14px;
  outline:none;
}
.torque-input::placeholder{color:#9aa1aa}
.torque-input:focus{
  outline:2px solid #93c5fd;
  outline-offset:0;
}
.unit-select{
  flex:0 0 82px;
  width:82px;
  padding:11px 8px;
  background:var(--subtle);
  color:var(--fg);
  border:1px solid var(--border);
  border-radius:12px;
  font-size:11px;
  font-weight:600;
}
.unit-select:focus{
  outline:2px solid #93c5fd;
  outline-offset:0;
}

/* Main calculate button */
.convert-btn{
  width:100%;
  padding:11px 12px;
  background:var(--blue);
  color:#fff;
  border:0;
  border-radius:12px;
  font-size:13px;
  font-weight:700;
  cursor:pointer;
  box-shadow:0 2px 8px rgba(37,99,235,.18);
  transition:opacity .15s,transform .05s;
}
.convert-btn:hover{opacity:.9}
.convert-btn:active{opacity:.8;transform:translateY(1px)}

/* Result */
.output-card{
  background:#f8fafc;
}
.output-card .input-title{
  color:#475569;
}
.output-container{
  display:flex;
  align-items:center;
  gap:8px;
}
.bar-output{
  flex:1;
  min-width:0;
  min-height:42px;
  padding:8px 10px;
  background:#fff;
  color:var(--green);
  border:1px solid var(--border);
  border-radius:10px;
  font-size:17px;
  font-weight:700;
  text-align:center;
  outline:none;
}
.output-container .unit-select{
  background:#fff;
}

/* Status */
.status{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  margin:10px 0;
  min-height:16px;
  line-height:1.4;
  padding:0 5px;
}
.status.success{color:var(--green)}
.status.warning{color:var(--orange)}
.status.error{color:var(--red)}
.status.info{color:var(--blue)}

/* Actions — compact chips/buttons like the other apps */
.action-buttons{
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  gap:6px;
  margin-top:10px;
}
.action-btn{
  width:100%;
  min-width:0;
  padding:9px 5px;
  border:1px solid var(--border);
  border-radius:10px;
  font-size:11px;
  font-weight:600;
  cursor:pointer;
  transition:opacity .15s,transform .05s;
  text-align:center;
}
.action-btn:hover{opacity:.9}
.action-btn:active{transform:translateY(1px)}
.action-btn.table,
.action-btn.compare{
  background:#fff;
  color:#334155;
}
.action-btn.pdf{
  background:#fff7ed;
  border-color:#fed7aa;
  color:#c2410c;
}
.action-btn.clear{
  background:var(--subtle);
  color:#64748b;
}

/* Modal */
.modal{
  position:fixed;
  inset:0;
  z-index:100;
  display:none;
  background:rgba(15,23,42,.28);
  backdrop-filter:blur(4px);
  overflow:auto;
  padding:12px;
}
.modal-content{
  width:min(100%,680px);
  margin:4vh auto 0;
  background:#fff;
  border:1px solid var(--border);
  border-radius:18px;
  box-shadow:0 12px 40px rgba(2,6,23,.16);
  padding:12px;
  max-height:90vh;
  overflow:auto;
}
.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:10px;
}
.modal-title{
  font-size:15px;
  font-weight:700;
  color:var(--fg);
}
.close-btn{
  width:34px;
  height:34px;
  padding:0;
  border:1px solid var(--border);
  border-radius:10px;
  background:var(--subtle);
  color:#64748b;
  font-size:18px;
  cursor:pointer;
}
.table-content{
  color:var(--fg);
  overflow-x:auto;
}
.table-info{
  background:var(--subtle);
  padding:9px;
  border-radius:10px;
  margin-bottom:10px;
  font-size:11px;
  color:var(--muted);
  text-align:center;
}

/* Tables */
.conversion-table,.comparison-table{
  width:100%;
  border-collapse:collapse;
  background:#fff;
  border:1px solid var(--border);
  border-radius:10px;
  overflow:hidden;
}
.conversion-table{font-size:11px}
.conversion-table th{
  background:#eff6ff;
  color:#1e40af;
  padding:8px 5px;
  text-align:center;
  font-weight:700;
  font-size:11px;
  border-bottom:1px solid #dbeafe;
}
.conversion-table td{
  padding:6px 5px;
  text-align:center;
  border-bottom:1px solid var(--border);
  color:var(--fg);
}
.conversion-table tr:last-child td{border-bottom:none}
.conversion-table tr:nth-child(even),
.comparison-table tr:nth-child(even){background:#f8fafc}
.conversion-table tr:hover,
.comparison-table tr:hover{background:#eff6ff}
.torque-value{font-weight:700;color:#ea580c}
.bar-value{font-weight:700;color:#16a34a}

.comparison-table{font-size:10px}
.comparison-table th{
  background:#eff6ff;
  color:#1e40af;
  padding:6px 3px;
  text-align:center;
  font-weight:700;
  font-size:10px;
  border-bottom:1px solid #dbeafe;
}
.comparison-table td{
  padding:4px 3px;
  text-align:center;
  border-bottom:1px solid var(--border);
  color:var(--fg);
  font-size:10px;
}
.comparison-table tr:last-child td{border-bottom:none}
.out-of-range{color:#94a3b8;font-style:italic}

/* Mobile */
@media(max-width:480px){
  .container{width:100%;padding:0 10px 28px}
  .header{margin:0 -10px 10px;padding:10px 14px}
  .title{font-size:17px}
  .card{padding:11px;margin-bottom:10px}
  .action-buttons{gap:5px}
  .action-btn{padding:8px 3px;font-size:10px}
  .modal{padding:8px}
  .modal-content{margin-top:2vh;max-height:92vh;padding:10px}
  .comparison-table th,.comparison-table td{padding:3px 2px;font-size:9px}
  .conversion-table th,.conversion-table td{padding:5px 3px;font-size:10px}
}
@media(max-width:350px){
  .input-container{gap:6px}
  .unit-select{flex-basis:68px;width:68px;padding:10px 5px;font-size:10px}
  .action-btn{font-size:9px;padding:7px 2px}
}
</style>

        // 단위 변환 상수
        const UNIT_CONVERSIONS = {
            KGM_TO_NM: 9.80665,
            FTLBS_TO_NM: 1.35582,
            NM_TO_KGM: 1 / 9.80665,
            NM_TO_FTLBS: 1 / 1.35582,
            BAR_TO_PSI: 14.5038,
            PSI_TO_BAR: 1 / 14.5038
        };

        // 전역 변수들
        let currentModel = 'Stealth-2';
        let currentTable = TORQUE_TABLES['Stealth-2'];
        let elements = {};
        let currentTorqueInNM = null;
        let currentPercentage = 100;

        function convertToNM(value, unit) {
            switch(unit) {
                case 'NM': return value;
                case 'KGM': return value * UNIT_CONVERSIONS.KGM_TO_NM;
                case 'FT.LBS': return value * UNIT_CONVERSIONS.FTLBS_TO_NM;
                default: return value;
            }
        }
        function convertFromNM(nmValue, unit) {
            switch(unit) {
                case 'NM': return nmValue;
                case 'KGM': return nmValue * UNIT_CONVERSIONS.NM_TO_KGM;
                case 'FT.LBS': return nmValue * UNIT_CONVERSIONS.NM_TO_FTLBS;
                default: return nmValue;
            }
        }
        function convertPressureFromBAR(barValue, unit) {
            switch(unit) {
                case 'BAR': return barValue;
                case 'PSI': return barValue * UNIT_CONVERSIONS.BAR_TO_PSI;
                default: return barValue;
            }
        }

        function updateTorqueInputUnit(newUnit) {
            if (currentTorqueInNM !== null && elements.torqueInput.value) {
                const convertedValue = convertFromNM(currentTorqueInNM, newUnit);
                elements.torqueInput.value = convertedValue.toFixed(newUnit === 'NM' ? 0 : 1);
            }
        }

        function updateRangeInfo() {
            const selectedUnit = elements.unitSelect.value;
            const table = currentTable;
            const minTorqueNM = table[0][0];
            const maxTorqueNM = table[table.length - 1][0];
            const minTorque = convertFromNM(minTorqueNM, selectedUnit);
            const maxTorque = convertFromNM(maxTorqueNM, selectedUnit);
            elements.rangeInfo.textContent = '범위: ' +
                minTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + ' - ' +
                maxTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + ' ' + selectedUnit;
        }

        function initializeApp() {
            elements = {
                modelSelect: document.getElementById('modelSelect'),
                rangeInfo: document.getElementById('rangeInfo'),
                torqueInput: document.getElementById('torqueInput'),
                percentageInput: document.getElementById('percentageInput'),
                unitSelect: document.getElementById('unitSelect'),
                barOutput: document.getElementById('barOutput'),
                pressureUnitSelect: document.getElementById('pressureUnitSelect'),
                status: document.getElementById('status'),
                modal: document.getElementById('modal'),
                modalTitle: document.getElementById('modalTitle'),
                modalContent: document.getElementById('modalContent')
            };
            setupEventListeners();
            updateRangeInfo();
            setStatus('모델을 선택하고 토크값을 입력하세요');
        }

        function setupEventListeners() {
            elements.modelSelect.addEventListener('change', function() {
                currentModel = this.value;
                currentTable = TORQUE_TABLES[currentModel];
                updateRangeInfo();
                setStatus(currentModel + ' 모델이 선택되었습니다', 'info');
                clearInputs();
            });

            elements.torqueInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertTorque();
            });
            elements.percentageInput.addEventListener('keypress', function(e) {
                if (e.key === 'Enter') convertTorque();
            });
            elements.percentageInput.addEventListener('input', function() {
                currentPercentage = parseFloat(this.value) || 100;
                if (elements.torqueInput.value) convertTorque();
            });
            elements.unitSelect.addEventListener('change', function() {
                updateTorqueInputUnit(this.value);
                updateRangeInfo();
                if (elements.torqueInput.value) convertTorque();
            });
            elements.pressureUnitSelect.addEventListener('change', function() {
                if (elements.barOutput.value) convertTorque();
            });
            elements.modal.addEventListener('click', function(e) {
                if (e.target === elements.modal) closeModal();
            });
            document.addEventListener('keydown', function(e) {
                if (e.key === 'Escape') closeModal();
            });
        }

        function convertTorque() {
            const inputValue = parseFloat(elements.torqueInput.value);
            const selectedUnit = elements.unitSelect.value;
            const pressureUnit = elements.pressureUnitSelect.value;
            const percentage = parseFloat(elements.percentageInput.value) || 100;

            if (!inputValue || isNaN(inputValue)) {
                setStatus('⚠️ 토크값을 입력해주세요', 'warning'); elements.barOutput.value = ''; return;
            }
            if (inputValue < 0) {
                setStatus('⚠️ 토크값은 0 이상이어야 합니다', 'error'); elements.barOutput.value = ''; return;
            }
            if (percentage < 0 || percentage > 200) {
                setStatus('⚠️ 퍼센테이지는 0~200% 범위여야 합니다', 'error'); elements.barOutput.value = ''; return;
            }

            const torqueValueInNM = convertToNM(inputValue, selectedUnit);
            const adjustedTorqueInNM = torqueValueInNM * (percentage / 100);
            currentTorqueInNM = adjustedTorqueInNM;
            const barValue = calculateBarValue(adjustedTorqueInNM);

            if (barValue === -1) {
                const maxTorqueNM = currentTable[currentTable.length - 1][0];
                const minTorqueNM = currentTable[0][0];
                const minTorque = convertFromNM(minTorqueNM, selectedUnit);
                const maxTorque = convertFromNM(maxTorqueNM, selectedUnit);
                setStatus('⚠️ 변환 범위를 벗어났습니다 (' +
                    minTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + ' - ' +
                    maxTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + ' ' + selectedUnit + ')', 'error');
                elements.barOutput.value = '';
            } else {
                const convertedPressure = convertPressureFromBAR(barValue, pressureUnit);
                elements.barOutput.value = convertedPressure.toFixed(1);

                let torqueDisplay = selectedUnit === 'NM'
                    ? inputValue.toLocaleString() + ' ' + selectedUnit
                    : inputValue.toLocaleString() + ' ' + selectedUnit + ' (' + torqueValueInNM.toFixed(1) + ' NM)';

                if (percentage !== 100) {
                    torqueDisplay += ' × ' + percentage + '% = ' + adjustedTorqueInNM.toFixed(1) + ' NM';
                }
                setStatus('✓ 변환 완료: ' + torqueDisplay + ' → ' + convertedPressure.toFixed(1) + ' ' + pressureUnit, 'success');
            }
        }

        // BAR 값 계산 (선형 보간)
        function calculateBarValue(torque) {
            const table = currentTable;
            if (torque < table[0][0] || torque > table[table.length - 1][0]) return -1;

            for (let i = 0; i < table.length; i++) {
                if (table[i][0] === torque) return table[i][1];
            }
            for (let i = 0; i < table.length - 1; i++) {
                if (torque >= table[i][0] && torque <= table[i + 1][0]) {
                    const x1 = table[i][0], y1 = table[i][1];
                    const x2 = table[i + 1][0], y2 = table[i + 1][1];
                    return y1 + (torque - x1) * (y2 - y1) / (x2 - x1);
                }
            }
            return -1;
        }

        function setStatus(message, type) {
            elements.status.textContent = message;
            elements.status.className = 'status' + (type ? ' ' + type : '');
        }

        function clearInputs() {
            elements.torqueInput.value = '';
            elements.percentageInput.value = '100';
            elements.barOutput.value = '';
            currentTorqueInNM = null;
            currentPercentage = 100;
            setStatus('토크값을 입력해주세요');
        }

        function showTable() {
            const selectedTorqueUnit = elements.unitSelect.value;
            const pressureUnit = elements.pressureUnitSelect.value;
            let html = '<div class="table-info">💡 총 ' + currentTable.length + '개의 변환 데이터 포인트</div>';
            html += '<table class="conversion-table">';
            html += '<thead><tr><th>순번</th><th>토크 (' + selectedTorqueUnit + ')</th><th>게이지 (' + pressureUnit + ')</th></tr></thead>';
            html += '<tbody>';

            for (let i = 0; i < currentTable.length; i++) {
                const torqueNM = currentTable[i][0];
                const barValue = currentTable[i][1];
                const convertedTorque = convertFromNM(torqueNM, selectedTorqueUnit);
                const convertedPressure = convertPressureFromBAR(barValue, pressureUnit);

                html += '<tr>';
                html += '<td>' + (i + 1) + '</td>';
                html += '<td class="torque-value">' + convertedTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + '</td>';
                html += '<td class="bar-value">' + convertedPressure.toFixed(1) + '</td>';
                html += '</tr>';
            }
            html += '</tbody></table>';
            showModal('📊 ' + currentModel + ' 변환표', html);
        }

        function showComparison() {
            const selectedTorqueUnit = elements.unitSelect.value;
            const pressureUnit = elements.pressureUnitSelect.value;

            // 비교 대상 모델 (여기에 MXT-10 추가)
            const models = ['Stealth-2', 'Stealth-4', 'Stealth-8', 'Stealth-14', 'Stealth-22', 'Stealth-36', 'MXT-.7', 'MXT-1', 'MXT-3', 'MXT-5', 'MXT-10', 'MXT-15', 'MXT-20', 'MXT-35', 'TWHC1', 'TWHC3', 'TWHC6', 'TWHC50', 'TWSD1', 'TWSD3', 'TWSD6', 'TWSD11', 'TWSD25'];

            let html = '<div class="table-info">🔍 ' + models.length + '개 모델의 동일 토크값 비교 분석 (' + pressureUnit + ' 단위)</div>';
            html += '<table class="comparison-table"><thead><tr>';
            html += '<th>토크 (' + selectedTorqueUnit + ')</th>';

            for (let k = 0; k < models.length; k++) {
                const modelTable = TORQUE_TABLES[models[k]];
                const minTorque = convertFromNM(modelTable[0][0], selectedTorqueUnit);
                const maxTorque = convertFromNM(modelTable[modelTable.length - 1][0], selectedTorqueUnit);
                html += '<th>' + models[k] + '<br><small>' +
                    minTorque.toLocaleString(undefined, {maximumFractionDigits: 0}) + '~' +
                    maxTorque.toLocaleString(undefined, {maximumFractionDigits: 0}) + '</small></th>';
            }
            html += '</tr></thead><tbody>';

            const commonTorquesNM = [500, 1000, 1500, 2000, 3000, 4000, 5000,
                                     6000, 7000, 8000, 9000, 10000, 11000,
                                     12000, 13000, 14000, 15000, 16000, 17000];

            for (let i = 0; i < commonTorquesNM.length; i++) {
                const torqueNM = commonTorquesNM[i];
                const convertedTorque = convertFromNM(torqueNM, selectedTorqueUnit);
                html += '<tr><td class="torque-value">' + convertedTorque.toLocaleString(undefined, {maximumFractionDigits: 1}) + '</td>';

                for (let j = 0; j < models.length; j++) {
                    const barValue = getBarValueForModel(torqueNM, TORQUE_TABLES[models[j]]);
                    if (barValue === -1) {
                        html += '<td class="out-of-range">범위초과</td>';
                    } else {
                        const convertedPressure = convertPressureFromBAR(barValue, pressureUnit);
                        html += '<td class="bar-value">' + convertedPressure.toFixed(1) + '</td>';
                    }
                }
                html += '</tr>';
            }
            html += '</tbody></table>';
            showModal('🔍 모델별 비교', html);
        }

        function openPdf() {
            const pdfUrl = PDF_LINKS[currentModel];
            if (pdfUrl && pdfUrl.trim() !== '') {
                try {
                    const newWindow = window.open(pdfUrl, '_blank');
                    if (newWindow) {
                        setStatus('📄 ' + currentModel + ' PDF 변환표를 열었습니다', 'info');
                    } else {
                        setStatus('⚠️ 팝업이 차단되었습니다. 브라우저 설정을 확인해주세요', 'warning');
                        if (confirm('팝업이 차단되어 PDF를 열 수 없습니다.\n직접 링크로 이동하시겠습니까?\n\n' + pdfUrl)) {
                            window.location.href = pdfUrl;
                        }
                    }
                } catch (error) {
                    setStatus('❌ PDF 열기에 실패했습니다: ' + error.message, 'error');
                }
            } else {
                setStatus('⚠️ ' + currentModel + ' 모델의 PDF 링크가 아직 등록되지 않았습니다', 'warning');
            }
        }

        function getBarValueForModel(torque, table) {
            if (torque < table[0][0] || torque > table[table.length - 1][0]) return -1;
            for (let i = 0; i < table.length; i++) if (table[i][0] === torque) return table[i][1];
            for (let i = 0; i < table.length - 1; i++) {
                if (torque >= table[i][0] && torque <= table[i + 1][0]) {
                    const x1 = table[i][0], y1 = table[i][1];
                    const x2 = table[i + 1][0], y2 = table[i + 1][1];
                    return y1 + (torque - x1) * (y2 - y1) / (x2 - x1);
                }
            }
            return -1;
        }

        function showModal(title, htmlContent) {
            elements.modalTitle.textContent = title;
            elements.modalContent.innerHTML = htmlContent;
            elements.modal.style.display = 'block';
        }
        function closeModal() { elements.modal.style.display = 'none'; }

        document.addEventListener('DOMContentLoaded', initializeApp);
    </script>
