<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>텍스트 줄바꿈 정리 도구</title>
<style>
  :root {
    --bg: #0f1210;
    --panel: #161b18;
    --line: #2a322d;
    --text: #d9e2dc;
    --dim: #7c8a82;
    --accent: #5fd39c;
    --accent-dim: #2f5f47;
    --mono: "SFMono-Regular", Consolas, "Liberation Mono", Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: var(--mono);
    height: 100%;
  }
  .wrap {
    max-width: 1100px;
    margin: 0 auto;
    padding: 28px 20px 60px;
  }
  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    border-bottom: 1px solid var(--line);
    padding-bottom: 16px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.02em;
    margin: 0;
    color: var(--text);
  }
  h1 span { color: var(--accent); }
  .rules {
    font-size: 12px;
    color: var(--dim);
    line-height: 1.7;
    margin-bottom: 22px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .rule-item {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    cursor: pointer;
    user-select: none;
  }
  .rule-item input[type=checkbox] {
    appearance: none;
    -webkit-appearance: none;
    width: 14px;
    height: 14px;
    margin-top: 2px;
    flex-shrink: 0;
    border: 1px solid var(--line);
    border-radius: 3px;
    background: var(--panel);
    cursor: pointer;
    position: relative;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .rule-item input[type=checkbox]:checked {
    background: var(--accent-dim);
    border-color: var(--accent);
  }
  .rule-item input[type=checkbox]:checked::after {
    content: "";
    position: absolute;
    left: 4px;
    top: 1px;
    width: 3px;
    height: 7px;
    border: solid var(--accent);
    border-width: 0 2px 2px 0;
    transform: rotate(45deg);
  }
  .rule-item span {
    color: var(--dim);
  }
  .rule-item input[type=checkbox]:not(:checked) ~ span {
    text-decoration: line-through;
    opacity: 0.55;
  }
  .rules code {
    background: #1d2420;
    padding: 1px 5px;
    border-radius: 3px;
    color: var(--accent);
  }
  .toolbar {
    display: flex;
    gap: 10px;
    align-items: center;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  button, .file-btn {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 4px;
    cursor: pointer;
    transition: border-color 0.15s ease, color 0.15s ease;
  }
  button:hover, .file-btn:hover {
    border-color: var(--accent-dim);
    color: var(--accent);
  }
  button.primary {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #eafff2;
  }
  button.primary:hover {
    border-color: var(--accent);
    color: var(--accent);
  }
  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }
  input[type=file] { display: none; }
  select#encodingSelect {
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 12px;
    padding: 7px 10px;
    border-radius: 4px;
    cursor: pointer;
  }
  select#encodingSelect:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  .filename {
    font-size: 12px;
    color: var(--dim);
  }
  .panes {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 760px) {
    .panes { grid-template-columns: 1fr; }
  }
  .pane {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .pane-label {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--dim);
  }
  textarea {
    width: 100%;
    height: 460px;
    background: var(--panel);
    border: 1px solid var(--line);
    color: var(--text);
    font-family: var(--mono);
    font-size: 13px;
    line-height: 1.6;
    padding: 14px;
    border-radius: 6px;
    resize: vertical;
    white-space: pre-wrap;
  }
  textarea:focus {
    outline: none;
    border-color: var(--accent-dim);
  }
  .status {
    font-size: 12px;
    color: var(--dim);
    margin-top: 10px;
    min-height: 16px;
  }
  .status.ok { color: var(--accent); }
</style>

    <meta name="inote:title" content="텍스트 줄바꿈 정리 도구">
    <meta name="inote:description" content="텍스트의 불필요한 줄바꿈과 문단을 정리합니다. PC 사용을 권장합니다.">
    <meta name="inote:category" content="Utility">
    <meta name="inote:icon" content="📝">
    <meta name="inote:keywords" content="텍스트, 줄바꿈, 문단, 정리">
    <meta name="inote:publish" content="true">
</head>
<body>
<div class="wrap">
  <header>
    <h1>텍스트 <span>정리</span> 도구</h1>
  </header>

  <div class="rules" id="ruleChecks">
    <label class="rule-item">
      <input type="checkbox" id="rule1" checked>
      <span>1. 각 줄 맨 앞 공백 제거</span>
    </label>
    <label class="rule-item">
      <input type="checkbox" id="rule2" checked>
      <span>2. 줄 사이 한 줄씩 띄우기</span>
    </label>
    <label class="rule-item">
      <input type="checkbox" id="rule3" checked>
      <span>3. 줄 끝이 <code>. ? ! " '</code> (스마트 따옴표 포함) 등으로 끝나지 않으면 다음 줄과 이어붙이기 (단, <code>* * *</code> 같은 구분선은 제외)</span>
    </label>
  </div>

  <div class="toolbar">
    <label class="file-btn" for="fileInput">파일 열기</label>
    <input type="file" id="fileInput" accept=".txt,text/plain">
    <span class="filename" id="fileName">선택된 파일 없음</span>
    <select id="encodingSelect" title="인코딩이 깨져 보이면 직접 선택해 다시 읽으세요">
      <option value="auto">인코딩: 자동 감지</option>
      <option value="utf-8">UTF-8</option>
      <option value="euc-kr">EUC-KR (CP949)</option>
      <option value="utf-16le">UTF-16LE</option>
      <option value="utf-16be">UTF-16BE</option>
    </select>
    <button class="primary" id="processBtn">처리하기</button>
    <button id="downloadBtn" disabled>결과 .txt로 저장</button>
    <button id="resetBtn">리셋</button>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-label">원본</div>
      <textarea id="inputArea" placeholder="여기에 텍스트를 붙여넣거나, 위에서 파일을 열어주세요."></textarea>
    </div>
    <div class="pane">
      <div class="pane-label">처리 결과</div>
      <textarea id="outputArea" placeholder="처리 결과가 여기에 표시됩니다." readonly></textarea>
    </div>
  </div>

  <div class="status" id="status"></div>
</div>

<script>
const fileInput = document.getElementById('fileInput');
const fileNameEl = document.getElementById('fileName');
const encodingSelect = document.getElementById('encodingSelect');
const inputArea = document.getElementById('inputArea');
const outputArea = document.getElementById('outputArea');
const processBtn = document.getElementById('processBtn');
const downloadBtn = document.getElementById('downloadBtn');
const resetBtn = document.getElementById('resetBtn');
const statusEl = document.getElementById('status');

let sourceFileName = 'result';
let lastBuffer = null;
let lastFileName = '';

// BOM 확인 후, 없으면 UTF-8로 엄격하게 시도하고 실패하면 EUC-KR(CP949)로 대체
function autoDecode(buffer) {
  const bytes = new Uint8Array(buffer);
  if (bytes.length >= 3 && bytes[0] === 0xEF && bytes[1] === 0xBB && bytes[2] === 0xBF) {
    return { text: new TextDecoder('utf-8').decode(buffer), used: 'UTF-8 (BOM)' };
  }
  if (bytes.length >= 2 && bytes[0] === 0xFF && bytes[1] === 0xFE) {
    return { text: new TextDecoder('utf-16le').decode(buffer), used: 'UTF-16LE' };
  }
  if (bytes.length >= 2 && bytes[0] === 0xFE && bytes[1] === 0xFF) {
    return { text: new TextDecoder('utf-16be').decode(buffer), used: 'UTF-16BE' };
  }
  try {
    return { text: new TextDecoder('utf-8', { fatal: true }).decode(buffer), used: 'UTF-8' };
  } catch (e) {
    try {
      return { text: new TextDecoder('euc-kr').decode(buffer), used: 'EUC-KR (CP949)' };
    } catch (e2) {
      return { text: new TextDecoder('utf-8').decode(buffer), used: 'UTF-8 (일부 깨질 수 있음)' };
    }
  }
}

function decodeWith(buffer, encoding) {
  if (encoding === 'auto') return autoDecode(buffer);
  try {
    return { text: new TextDecoder(encoding).decode(buffer), used: encoding };
  } catch (e) {
    return { text: new TextDecoder('utf-8').decode(buffer), used: 'UTF-8 (대체)' };
  }
}

fileInput.addEventListener('change', async () => {
  const file = fileInput.files[0];
  if (!file) return;
  sourceFileName = file.name.replace(/\.[^/.]+$/, '');
  lastFileName = file.name;
  fileNameEl.textContent = file.name;
  try {
    lastBuffer = await file.arrayBuffer();
    const { text, used } = decodeWith(lastBuffer, encodingSelect.value);
    inputArea.value = text;
    statusEl.textContent = `"${file.name}" 불러옴 (${used}, ${text.split(/\r\n|\r|\n/).length}줄) — 글자가 깨져 보이면 위 인코딩을 직접 선택하세요.`;
    statusEl.className = 'status';
  } catch (e) {
    statusEl.textContent = '파일을 읽는 중 오류가 발생했습니다.';
    statusEl.className = 'status';
  }
});

encodingSelect.addEventListener('change', () => {
  if (!lastBuffer) return;
  const { text, used } = decodeWith(lastBuffer, encodingSelect.value);
  inputArea.value = text;
  statusEl.textContent = `"${lastFileName}"을(를) ${used}(으)로 다시 읽었습니다.`;
  statusEl.className = 'status';
});

const rule1Check = document.getElementById('rule1');
const rule2Check = document.getElementById('rule2');
const rule3Check = document.getElementById('rule3');

// 드래그앤드롭으로 파일이 열리거나 페이지가 이동하는 브라우저 기본 동작을 완전히 차단
['dragover', 'drop'].forEach(evt => {
  window.addEventListener(evt, (e) => {
    e.preventDefault();
    e.stopPropagation();
  });
});

// 줄 끝 판단용: 마침표, 물음표, 느낌표, 큰따옴표/작은따옴표(스마트 따옴표 포함),
// 한국어 문장부호 및 각종 닫는 괄호/인용부호까지 폭넓게 포함
const TERMINAL_REGEX = /["'“”‘’„‚‹›«»…”’」』】》〉、。！？.?!]$/;

// 문자/숫자(한글 포함) 없이 특수문자와 공백만으로 이루어진 줄 (구분선: * * *, ---, === 등)
const SEPARATOR_LINE_REGEX = /^[^\p{L}\p{N}]+$/u;

function processText(raw, opts) {
  // 줄바꿈 통일
  const rawLines = raw.split(/\r\n|\r|\n/);

  // 규칙 1: 각 줄 맨 앞 공백 제거
  const trimmedLines = opts.rule1
    ? rawLines.map(l => l.replace(/^[ \t\u00A0\u3000]+/, ''))
    : rawLines;

  let merged;

  if (opts.rule3) {
    // 규칙 3: 종결부호로 끝나지 않는 줄은 다음 줄과 이어붙이기
    // 단, 특수문자만 나열된 구분선은 병합에서 제외하고 독립된 줄로 유지
    merged = [];
    let current = null;

    for (const line of trimmedLines) {
      const trimmed = line.trim();
      const isBlank = trimmed === '';
      const isSeparator = !isBlank && SEPARATOR_LINE_REGEX.test(trimmed);

      if (isBlank) {
        // 원본에 있던 빈 줄은 문단 구분으로 처리
        if (current !== null) {
          merged.push(current);
          current = null;
        }
        continue;
      }

      if (isSeparator) {
        // 구분선은 이어붙이지 않고 독립된 줄로 그대로 유지
        if (current !== null) {
          merged.push(current);
          current = null;
        }
        merged.push(line);
        continue;
      }

      if (current === null) {
        current = line;
      } else {
        current = current.replace(/\s+$/, '') + ' ' + line;
      }

      if (TERMINAL_REGEX.test(current.replace(/\s+$/, ''))) {
        merged.push(current.replace(/\s+$/, ''));
        current = null;
      }
    }
    if (current !== null) {
      merged.push(current.replace(/\s+$/, ''));
    }
  } else {
    // 규칙 3 비활성 — 빈 줄만 제거하고 원래 줄 구성 유지
    merged = trimmedLines.filter(l => l.trim() !== '');
  }

  // 규칙 2: 줄과 줄 사이 한 줄씩 띄우기 (아니면 그냥 한 줄바꿈)
  const separator = opts.rule2 ? '\n\n' : '\n';
  return merged.join(separator);
}

processBtn.addEventListener('click', () => {
  const raw = inputArea.value;
  if (!raw.trim()) {
    statusEl.textContent = '먼저 텍스트를 입력하거나 파일을 열어주세요.';
    statusEl.className = 'status';
    return;
  }
  const opts = {
    rule1: rule1Check.checked,
    rule2: rule2Check.checked,
    rule3: rule3Check.checked
  };
  const result = processText(raw, opts);
  outputArea.value = result;
  downloadBtn.disabled = false;
  const paraCount = opts.rule2
    ? result.split('\n\n').filter(Boolean).length
    : result.split('\n').filter(Boolean).length;
  statusEl.textContent = `처리 완료 — ${paraCount}개 줄/문단으로 정리됨.`;
  statusEl.className = 'status ok';
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([outputArea.value], { type: 'text/plain;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `${sourceFileName}_정리됨.txt`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
});

resetBtn.addEventListener('click', () => {
  inputArea.value = '';
  outputArea.value = '';
  fileInput.value = '';
  fileNameEl.textContent = '선택된 파일 없음';
  encodingSelect.value = 'auto';
  rule1Check.checked = true;
  rule2Check.checked = true;
  rule3Check.checked = true;
  sourceFileName = 'result';
  lastBuffer = null;
  lastFileName = '';
  downloadBtn.disabled = true;
  statusEl.textContent = '리셋되었습니다.';
  statusEl.className = 'status';
});
</script>
</body>
</html>
