<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f8fc">
  <script>
    (() => {
      try {
        const saved = localStorage.getItem("inote-theme");
        document.documentElement.dataset.theme = saved === "dark" ? "dark" : "light";
      } catch (_) {
        document.documentElement.dataset.theme = "light";
      }
    })();
  </script>
  <meta name="description" content="iNote Web Apps - 유용한 웹 도구를 한곳에서">
  <title>iNote Web Apps</title>
  <style>
    :root{--blue:#2878d7;--blue-dark:#1557a5;--ink:#172b4d;--muted:#718096;--line:#e4ebf3;--bg:#f5f8fc;--white:#fff}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","맑은 고딕",Segoe UI,sans-serif;line-height:1.5}
    a{color:inherit;text-decoration:none}
    .shell{width:min(1120px,calc(100% - 36px));margin:0 auto}
    .topbar{height:76px;display:flex;align-items:center;justify-content:space-between}
    .brand{display:flex;align-items:center;gap:12px;font-weight:800;font-size:20px;letter-spacing:-.5px}
    .brand-mark{width:42px;height:42px;border-radius:13px;background:linear-gradient(145deg,#398bea,#1764bd);display:grid;place-items:center;color:#fff;font-size:17px;box-shadow:0 5px 14px #2878d733}
    .brand small{display:block;font-size:11px;color:var(--muted);font-weight:500;letter-spacing:.2px;margin-top:1px}
    .top-note{font-size:12px;color:var(--muted)}
    .hero{background:linear-gradient(120deg,#eaf3ff,#f7faff 70%);border:1px solid #dce9f8;border-radius:22px;padding:30px 32px;margin:16px 0 25px}
    .eyebrow{font-size:11px;font-weight:800;letter-spacing:1.4px;color:var(--blue);text-transform:uppercase}
    h1{font-size:clamp(25px,4vw,34px);letter-spacing:-1.2px;margin:8px 0 7px}
    .hero p{margin:0;color:#64748b;font-size:14px}
    .search-wrap{position:relative;margin-top:22px;max-width:560px}
    .search-wrap svg{position:absolute;left:15px;top:50%;transform:translateY(-50%);width:18px;color:#8a9bb0}
    #search{width:100%;height:48px;border:1px solid #dce5ef;border-radius:12px;background:#fff;padding:0 16px 0 44px;font:inherit;font-size:14px;outline:none;box-shadow:0 3px 10px #1c4c7b08}
    #search:focus{border-color:#80b4ed;box-shadow:0 0 0 3px #2878d71a}
    .section-head{display:flex;align-items:center;justify-content:space-between;margin:26px 2px 13px}
    .section-head h2{font-size:16px;margin:0;letter-spacing:-.3px}
    #count{font-size:12px;color:var(--muted)}
    .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}
    .filter{border:1px solid var(--line);background:#fff;color:#52657d;border-radius:999px;padding:8px 15px;font:inherit;font-size:12px;cursor:pointer;transition:.15s}
    .filter:hover{border-color:#a9c9ed;color:var(--blue)}
    .filter.active{background:var(--blue);border-color:var(--blue);color:#fff;font-weight:700}
    .grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:13px}
    .card{min-height:150px;background:#fff;border:1px solid var(--line);border-radius:15px;padding:18px;display:flex;flex-direction:column;transition:transform .18s,border-color .18s,box-shadow .18s}
    .card:hover{transform:translateY(-3px);border-color:#b8d3f1;box-shadow:0 10px 24px #204b7610}
    .card-top{display:flex;align-items:center;justify-content:space-between}
    .app-icon{width:42px;height:42px;border-radius:12px;background:#edf5ff;display:grid;place-items:center;font-size:22px}
    .launch{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;color:#7e91a8;background:#f5f8fc}
    .card h3{font-size:14px;margin:13px 0 5px;letter-spacing:-.25px}
    .card p{font-size:12px;color:var(--muted);margin:0;line-height:1.55}
    .card-bottom{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:13px}
    .tag{font-size:10px;color:#4777ac;background:#f0f6fd;border-radius:5px;padding:4px 7px}
    .open-label{font-size:11px;color:var(--blue);font-weight:700}
    .empty{display:none;text-align:center;padding:48px 15px;background:#fff;border:1px dashed #cfdae7;border-radius:15px;color:var(--muted);font-size:13px}
    footer{padding:35px 0 28px;text-align:center;color:#9aa8b8;font-size:11px}
    :root[data-theme="dark"]{--ink:#e7edf7;--muted:#9eacc0;--line:#34445b;--bg:#111827;--white:#1b2638}
    :root[data-theme="dark"] body{background:var(--bg);color:var(--ink)}
    :root[data-theme="dark"] .hero{background:linear-gradient(120deg,#1c304a,#1b2638 75%);border-color:#344b68}
    :root[data-theme="dark"] .hero p{color:#a8b7ca}
    :root[data-theme="dark"] #search{background:#202d40;border-color:#3a4b63;color:#edf3fb;box-shadow:none}
    :root[data-theme="dark"] #search::placeholder{color:#91a0b4}
    :root[data-theme="dark"] .filter{background:#202d40;border-color:#3a4b63;color:#c1ccda}
    :root[data-theme="dark"] .filter.active{background:var(--blue);border-color:var(--blue);color:#fff}
    :root[data-theme="dark"] .card{background:#1b2638;border-color:#34445b}
    :root[data-theme="dark"] .card:hover{border-color:#5278a6;box-shadow:0 10px 24px #0005}
    :root[data-theme="dark"] .app-icon{background:#263c58}
    :root[data-theme="dark"] .launch{background:#29374b;color:#b5c3d5}
    :root[data-theme="dark"] .tag{background:#263c58;color:#a9cfff}
    :root[data-theme="dark"] .empty{background:#1b2638;border-color:#40516a;color:var(--muted)}
    :root[data-theme="dark"] footer{color:#77879d}
    .top-actions{display:flex;align-items:center;gap:12px}
    .theme-toggle{width:40px;height:40px;border:1px solid var(--line);border-radius:12px;background:var(--white);color:var(--ink);display:grid;place-items:center;cursor:pointer;font-size:18px;transition:.15s}
    .theme-toggle:hover{border-color:#91b9e6;transform:translateY(-1px)}
    .release-badge{font-size:9px;font-weight:800;letter-spacing:.3px;padding:4px 6px;border-radius:5px;line-height:1}
    .release-badge.new{background:#e7f8ed;color:#168044}
    .release-badge.update{background:#fff2df;color:#a85a00}
    :root[data-theme="dark"] .release-badge.new{background:#173d2b;color:#75dfa0}
    :root[data-theme="dark"] .release-badge.update{background:#49331c;color:#ffc477}
    .card-title-row{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
    @media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.top-note{display:none}}
    @media(max-width:520px){.shell{width:min(100% - 26px,1120px)}.topbar{height:66px}.brand{font-size:18px}.brand-mark{width:38px;height:38px}.hero{padding:23px 19px;border-radius:18px;margin-top:10px}.hero p{font-size:12px}.grid{gap:9px}.card{padding:14px;min-height:145px}.card h3{font-size:13px}.card p{font-size:11px}.app-icon{width:38px;height:38px;font-size:20px}}
    @media(max-width:350px){.grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="iNote Web Apps 홈">
        <span class="brand-mark">iN</span>
        <span>iNote Web Apps<small>Useful Tools, All in One Place</small></span>
      </a>
      <div class="top-actions">
        <span class="top-note">PERSONAL WEB APPLICATIONS</span>
        <button class="theme-toggle" id="themeToggle" type="button" aria-label="다크 모드로 변경" title="테마 변경">🌙</button>
      </div>
    </header>
    <main>
      <section class="hero">
        <div class="eyebrow">iNote Tools Collection</div>
        <h1>필요한 도구를 한곳에서</h1>
        <p>업무와 일상에 유용한 웹 도구를 빠르고 편리하게 이용하세요.</p>
        <label class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <input id="search" type="search" placeholder="웹앱 이름이나 기능 검색..." autocomplete="off">
        </label>
      </section>
      <div class="section-head"><h2>웹앱 목록</h2><span id="count">불러오는 중...</span></div>
      <nav class="filters" id="filters" aria-label="카테고리 필터"></nav>
      <section class="grid" id="apps" aria-live="polite"></section>
      <div class="empty" id="empty">검색 결과가 없습니다.</div>
    </main>
    <footer>© iNote Web Apps · Built for everyday work</footer>
  </div>
  <script>
    const state = { apps: [], category: "전체", query: "" };
    const $ = (selector) => document.querySelector(selector);
    const escapeHtml = (value) => String(value ?? "").replace(/[&<>"']/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
    function getReleaseBadge(app) {
      const badge = String(app.badge || "").toLowerCase();
      const until = app.badgeUntil ? new Date(app.badgeUntil + "T23:59:59") : null;
      const valid = (badge === "new" || badge === "update") && until && !Number.isNaN(until.getTime()) && until >= new Date();
      if (!valid) return "";
      const label = badge === "new" ? "NEW" : "UPDATE";
      return `<span class="release-badge ${badge}">${label}</span>`;
    }
    const themeToggle = $("#themeToggle");
    function applyTheme(theme) {
      document.documentElement.dataset.theme = theme;
      const dark = theme === "dark";
      themeToggle.textContent = dark ? "☀️" : "🌙";
      themeToggle.setAttribute("aria-label", dark ? "라이트 모드로 변경" : "다크 모드로 변경");
      themeToggle.title = dark ? "라이트 모드" : "다크 모드";
      document.querySelector('meta[name="theme-color"]').content = dark ? "#111827" : "#f5f8fc";
    }
    applyTheme(document.documentElement.dataset.theme || "light");
    themeToggle.addEventListener("click", () => {
      const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("inote-theme", next); } catch (_) {}
      applyTheme(next);
    });
    function renderFilters() {
      const categories = ["전체", ...new Set(state.apps.map(app => app.category))];
      $("#filters").innerHTML = categories.map(category =>
        `<button class="filter ${state.category === category ? "active" : ""}" data-category="${escapeHtml(category)}">${escapeHtml(category)}</button>`
      ).join("");
    }
    function renderApps() {
      const query = state.query.trim().toLocaleLowerCase();
      const filtered = state.apps.filter(app => {
        const categoryMatch = state.category === "전체" || app.category === state.category;
        const haystack = [app.title, app.description, app.category, app.keywords].join(" ").toLocaleLowerCase();
        return categoryMatch && (!query || haystack.includes(query));
      });
      $("#apps").innerHTML = filtered.map(app => `
        <a class="card" href="${escapeHtml(app.url)}">
          <div class="card-top"><span class="app-icon">${escapeHtml(app.icon)}</span><span class="launch" aria-hidden="true">↗</span></div>
          <div class="card-title-row"><h3>${escapeHtml(app.title)}</h3>${getReleaseBadge(app)}</div>
          <p>${escapeHtml(app.description)}</p>
          <div class="card-bottom"><span class="tag">${escapeHtml(app.category)}</span><span class="open-label">열기 →</span></div>
        </a>`).join("");
      $("#count").textContent = `${filtered.length} / ${state.apps.length}개`;
      $("#empty").style.display = filtered.length ? "none" : "block";
    }
    $("#filters").addEventListener("click", event => {
      const button = event.target.closest("[data-category]");
      if (!button) return;
      state.category = button.dataset.category;
      renderFilters(); renderApps();
    });
    $("#search").addEventListener("input", event => { state.query = event.target.value; renderApps(); });
    fetch("./apps.json", { cache: "no-store" })
      .then(response => { if (!response.ok) throw new Error("apps.json을 불러오지 못했습니다."); return response.json(); })
      .then(data => { state.apps = Array.isArray(data.apps) ? data.apps : []; renderFilters(); renderApps(); })
      .catch(error => {
        $("#count").textContent = "목록 로딩 실패";
        $("#empty").style.display = "block";
        $("#empty").textContent = "앱 목록을 불러오지 못했습니다. 배포 전 npm run build를 실행했는지 확인해 주세요.";
        console.error(error);
      });
  </script>
</body>
</html>
